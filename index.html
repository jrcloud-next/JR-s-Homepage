<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="JR的个人主页">
    <meta name="theme-color" content="#070d19">
    <title>JR's Homepage</title>
    <link rel="icon" href="./jr.2723aec8.jpg" type="image/jpeg">
    <link rel="stylesheet" href="./assets/vendor/fontawesome/css/all.min.104be3d4.css">
    <link rel="stylesheet" href="./assets/css/style.3a125685.css">
</head>
<body>
    <div class="background" id="background" aria-hidden="true"
         data-ref="bwPYkH4J6T+WPbM2GmV/P9wzgNs+8VcM"
         data-v="BDQ0NQkSwT0Nz/4YV+SjapwLTbBLIy7/"
         data-x="xVUpBrBWsfykM0Pg6vHSdPI4FWF0eEwx"></div>
    <div class="bg-scrim" aria-hidden="true"></div>

    <main class="container" id="main-card">
        <header class="card-topbar">
            <div class="badge-row">
                <span class="status-dot" aria-hidden="true"></span>
                <span id="greeting-text">你好，欢迎来访</span>
            </div>

            <div class="timepiece" aria-label="当前日期与时间">
                <span class="date-text" id="date-text"></span>
                <span class="time-divider" aria-hidden="true"></span>
                <time class="clock" id="clock-text"></time>
            </div>

            <button type="button" class="icon-action" id="wallpaper-toggle"
                    title="欣赏今日壁纸" aria-label="欣赏今日壁纸" aria-pressed="false">
                <i class="fas fa-image" aria-hidden="true"></i>
            </button>
        </header>

        <div class="card-body">
            <section class="profile" aria-label="个人介绍">
                <div class="avatar-container">
                    <img src="./jr.2723aec8.jpg" alt="JR" class="avatar" decoding="async">
                </div>

                <div class="identity">
                    <h1 class="profile-name">JR</h1>
                    <p class="profile-domain">
                        <i class="fas fa-globe" aria-hidden="true"></i>
                        <span>jrofficial.cn</span>
                    </p>
                </div>
            </section>

            <div class="content">
                <section class="quote-card" aria-label="随机歌词">
                    <div class="quote-card-header">
                        <span class="quote-tag">
                            <span class="melody-bars" aria-hidden="true">
                                <i></i><i></i><i></i>
                            </span>
                            <span>歌词日签</span>
                        </span>
                        <button type="button" class="quote-refresh" id="quote-refresh"
                                title="换一句歌词" aria-label="换一句歌词">
                            <i class="fas fa-arrows-rotate" aria-hidden="true"></i>
                            <span>换一句</span>
                        </button>
                    </div>

                    <p class="tagline quote-text quote-loading" id="quote-text">
                        <span class="quote-line" id="quote-line-1"></span>
                        <span class="quote-line" id="quote-line-2"></span>
                    </p>
                </section>

                <nav class="social-links" aria-label="社交链接">
                    <a href="https://qm.qq.com/q/oj2XiX2B9u" class="social-link" data-brand="qq"
                       target="_blank" rel="noopener noreferrer">
                        <span class="social-icon"><i class="fab fa-qq" aria-hidden="true"></i></span>
                        <span class="social-meta">
                            <span class="social-name">QQ</span>
                            <span class="social-desc">即时联系</span>
                        </span>
                        <svg class="social-arrow" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                            <path d="M5 11L11 5M11 5H6.2M11 5V9.8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </a>

                    <a href="https://m.bilibili.com/space/621473799" class="social-link" data-brand="bilibili"
                       target="_blank" rel="noopener noreferrer">
                        <span class="social-icon"><i class="fab fa-bilibili" aria-hidden="true"></i></span>
                        <span class="social-meta">
                            <span class="social-name">哔哩哔哩</span>
                            <span class="social-desc">视频动态</span>
                        </span>
                        <svg class="social-arrow" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                            <path d="M5 11L11 5M11 5H6.2M11 5V9.8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </a>

                    <a href="http://www.coolapk.com/u/8375906" class="social-link" data-brand="coolapk"
                       target="_blank" rel="noopener noreferrer">
                        <span class="social-icon"><i class="fas fa-mobile-screen-button" aria-hidden="true"></i></span>
                        <span class="social-meta">
                            <span class="social-name">酷安</span>
                            <span class="social-desc">数码社区</span>
                        </span>
                        <svg class="social-arrow" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                            <path d="M5 11L11 5M11 5H6.2M11 5V9.8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </a>

                    <a href="https://github.com/jrcloud-next" class="social-link" data-brand="github"
                       target="_blank" rel="noopener noreferrer">
                        <span class="social-icon"><i class="fab fa-github" aria-hidden="true"></i></span>
                        <span class="social-meta">
                            <span class="social-name">GitHub</span>
                            <span class="social-desc">@jrcloud-next</span>
                        </span>
                        <svg class="social-arrow" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                            <path d="M5 11L11 5M11 5H6.2M11 5V9.8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </a>
                </nav>
            </div>
        </div>

        <footer class="footer">
            <span class="footer-motto">Stay Simple · Stay True</span>
            <p class="footer-copy">© <span class="year-highlight" id="current-year"></span> · JR · <a href="https://beian.miit.gov.cn/" class="icp-link" target="_blank" rel="noopener noreferrer">浙ICP备2026099947号</a></p>
        </footer>
    </main>

    <button type="button" class="wallpaper-restore" id="wallpaper-restore" aria-label="返回主页">
        <i class="fas fa-eye" aria-hidden="true"></i>
        <span>返回主页</span>
    </button>

    <script src="./assets/js/main.c9640759.js"></script>
</body>
</html>
